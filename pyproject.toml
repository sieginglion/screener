[project]
name = "screener"
version = "0.1.0"
description = "Stock screener and moat-ranking scripts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "diskcache",
    "finmind",
    "google-genai",
    "httpx",
    "openai",
    "python-dotenv",
    "xai-sdk",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.62",
]

[tool.ruff]
target-version = "py312"
